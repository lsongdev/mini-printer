[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D BLE_ENABLED=0
build_src_filter =
    +<*>
    -<transport/ble_transport.cpp>

; BLE + Wi-Fi no longer fits the 1.25 MiB default app slot.
; min_spiffs keeps OTA support while giving each app partition more room.
board_build.partitions = min_spiffs.csv

[env:esp32dev_ble]
extends = env:esp32dev
build_flags = -D BLE_ENABLED=1
build_src_filter = +<*>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -Itest/mocks
build_src_filter =
    +<protocol/>
    +<hal/em_button.cpp>
