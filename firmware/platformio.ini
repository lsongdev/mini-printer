[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D BLE_ENABLED=1
build_src_filter = +<*>
lib_deps =
    https://github.com/lsongdev/kbutton.c.git#f0665ecca96674aa7ee033407734f0f76b386a40

; BLE + Wi-Fi no longer fits the 1.25 MiB default app slot.
; min_spiffs keeps OTA support while giving each app partition more room.
board_build.partitions = min_spiffs.csv

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -Itest/mocks
build_src_filter =
    +<protocol/>
