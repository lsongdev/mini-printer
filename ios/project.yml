name: MiniPrinter
options:
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MiniPrinter:
    type: application
    platform: iOS
    sources:
      - path: MiniPrinter/Sources
      - path: MiniPrinter/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lsong.printer
        DEVELOPMENT_TEAM: 2ZHWSJ25BU
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connect to your Mini Printer and send print jobs."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MiniPrinterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiniPrinterTests
    dependencies:
      - target: MiniPrinter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
